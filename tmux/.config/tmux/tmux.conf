# Add binding to reload tmux.conf for fast, iterative development
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded!"

# Run Tmux Sessionizer script on m
bind m new-window "~/.config/scripts/tmux/session.sh"
bind n next-window
# Made explicit (it's tmux's built-in default) so it can't be shadowed silently.
bind p previous-window
bind N new-window "~/.config/scripts/tmux/notes.sh"
bind M new-window "~/.config/scripts/tmux/notes.sh ."
bind t new-window "~/Desktop/Projects/go-notes/notes.exe"
bind-key g new-window -c "#{pane_current_path}" -n "lazygit" "$SHELL -lc 'lazygit'"
bind-key A new-window -c "#{pane_current_path}" -n "lazydocker" "$SHELL -lc 'lazydocker'"

# Set Prefix
unbind C-b
unbind C-Space
set -g prefix C-Space
bind C-Space send-prefix

# Set Page Index to 1
set -g base-index 1
setw -g pane-base-index 1
setw -g pane-base-index 1

# Land in another session instead of ejecting to the shell when the
# attached session is destroyed (kill-session, last pane exiting).
set -g detach-on-destroy off

# Respawn a dead pane in place (-k also recycles a live one). Shadows tmux's
# default `E` (spread panes evenly).
bind E respawn-pane -k -c "#{pane_current_path}"

# Theming
# clock mode
setw -g clock-mode-colour blue

# statusbar
set -g status-position bottom
set -g status-justify left

set -g status-interval 5

set -g status-left ''
set -g status-left-length 10

set -g status-right '%Y-%m-%d %H:%M '
set -g status-right-length 50

setw -g window-status-current-format ' #I #W #F '

set -g mouse on

# Enable system‐clipboard integration (tmux ≥ 2.6)
set -g set-clipboard on
# Copy-mode copies also go straight to the macOS clipboard, so copying works
# whether or not the terminal honours OSC52.
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

# allow-passthrough enables DCS-wrapped passthrough sequences (used by
# things like terminal image protocols) -- it is NOT what makes raw OSC52
# clipboard writes work; that's set-clipboard above. Kept on since some
# tools do use DCS passthrough.
set -g allow-passthrough on
set -g focus-events on            # so vim knows when to pull tmux’s buffer

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -ga terminal-overrides ",xterm-ghostty:Tc"     # truecolor for Ghostty's TERM
# colored/undercurl underlines passthrough (nvim LSP diagnostics)
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p2%{256}%/%d::%p3%d m'

# # BINDINGS
# # — Window: leader + j/k/l/; → windows 1–4
# bind j select-window -t 1           # leader+j → window 1 :contentreference[oaicite:3]{index=3}
# bind k select-window -t 2           # leader+k → window 2 :contentreference[oaicite:4]{index=4}
# bind l select-window -t 3           # leader+l → window 3 :contentreference[oaicite:5]{index=5}
#
# Neovim Configuration

# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator
# TODO: LOOK at PLUGIN Version
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
# bind-key -T copy-mode-vi 'C-\' select-pane -l


# All tpm state lives under the XDG tree (plugins install here; tpm itself is
# cloned here too — see install.sh). The legacy ~/.tmux/ location is retired.
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.config/tmux/plugins/'

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'dreamsofcode-io/catppuccin-tmux'

# THEMES
set -g @catppuccin_flavour 'mocha'


# set vi-mode
set-window-option -g mode-keys vi

# Open pane in current dir
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

run '~/.config/tmux/plugins/tpm/tpm'
